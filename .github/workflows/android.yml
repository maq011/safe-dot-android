name: Build APK

on:
  push:
    branches: [ "master", "main" ] # Сработает при любом изменении кода
  workflow_dispatch: # Позволит запустить сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safedot-debug-apk
        path: app/build/outputs/apk/debug/*.apk
